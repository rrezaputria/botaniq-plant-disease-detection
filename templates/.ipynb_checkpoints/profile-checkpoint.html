{% extends "base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}

<section class="hero-section">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-lg-6">

        <div class="card p-4 shadow-lg border-0">

          <h3 class="text-center text-success fw-bold mb-4">Profil Pengguna</h3>

          <div class="mb-3">
            <label>Nama</label>
            <input type="text" class="form-control" value="{{ user['nama'] }}" disabled>
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input type="text" class="form-control" value="{{ user['email'] }}" disabled>
          </div>

          <div class="mb-3">
            <label>Role</label>
            <input type="text" class="form-control" value="{{ user['role'] |capitalize }}" disabled>
          </div>

          <div class="mb-3">
            <label>Kecamatan</label>
            <input type="text" class="form-control" value="{{ user['kecamatan'] }}" disabled>
          </div>

          <hr>

          <form method="POST">
            <div class="mb-3">
              <label>Ubah Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-success w-100">Update Password</button>
          </form>

        </div>

      </div>

    </div>
  </div>
</section>

{% endblock %}
